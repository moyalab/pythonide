<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 825 675" font-family="'Segoe UI', Roboto, sans-serif">
  <!-- backdrop -->
  <rect x="0" y="0" width="825" height="675" fill="#ffffff"/>

  <!-- modal frame -->
  <rect x="8" y="8" width="809" height="659" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>

  <!-- header band -->
  <rect x="8" y="8" width="809" height="50" rx="6" fill="#e8f0fe"/>
  <rect x="8" y="44" width="809" height="14" fill="#e8f0fe"/>
  <text x="32" y="40" font-size="16" font-weight="600" fill="#1a73e8">Export your model to use it in projects.</text>
  <text x="785" y="40" font-size="20" fill="#1a73e8" text-anchor="middle">×</text>

  <!-- top tabs -->
  <g font-size="14">
    <text x="115" y="92" fill="#1a73e8" font-weight="600" text-anchor="middle">Tensorflow.js</text>
    <circle cx="180" cy="88" r="7" fill="none" stroke="#1a73e8" stroke-width="1"/>
    <text x="180" y="92" fill="#1a73e8" text-anchor="middle" font-size="10">i</text>

    <text x="305" y="92" fill="#1a73e8" text-anchor="middle">Tensorflow</text>
    <circle cx="365" cy="88" r="7" fill="none" stroke="#1a73e8" stroke-width="1"/>
    <text x="365" y="92" fill="#1a73e8" text-anchor="middle" font-size="10">i</text>

    <text x="495" y="92" fill="#1a73e8" text-anchor="middle">Tensorflow Lite</text>
    <circle cx="567" cy="88" r="7" fill="none" stroke="#1a73e8" stroke-width="1"/>
    <text x="567" y="92" fill="#1a73e8" text-anchor="middle" font-size="10">i</text>
  </g>
  <!-- selected tab underline (Tensorflow.js) -->
  <line x1="40" y1="110" x2="220" y2="110" stroke="#1a73e8" stroke-width="3"/>
  <line x1="220" y1="110" x2="805" y2="110" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Export your model -->
  <text x="32" y="148" font-size="14" font-weight="600" fill="#202124">Export your model:</text>

  <!-- Upload radio (unselected) -->
  <circle cx="48" cy="190" r="9" fill="none" stroke="#5f6368" stroke-width="1.5"/>
  <text x="65" y="195" font-size="14" fill="#202124">Upload (shareable link)</text>

  <!-- Download radio (selected) -->
  <circle cx="220" cy="190" r="9" fill="none" stroke="#1a73e8" stroke-width="1.5"/>
  <circle cx="220" cy="190" r="4.5" fill="#1a73e8"/>
  <text x="237" y="195" font-size="14" fill="#1a73e8" font-weight="600">Download</text>

  <!-- Download my model button -->
  <rect x="320" y="172" width="195" height="36" rx="3" fill="#e8f0fe"/>
  <text x="347" y="195" font-size="14" fill="#1a73e8" font-weight="500">↓  Download my model</text>

  <!-- Code snippets to use your model -->
  <text x="32" y="258" font-size="14" font-weight="600" fill="#202124">Code snippets to use your model:</text>

  <!-- bottom tabs -->
  <text x="80" y="296" font-size="14" fill="#1a73e8" font-weight="600" text-anchor="middle">Javascript</text>
  <text x="195" y="296" font-size="14" fill="#5f6368" text-anchor="middle">p5.js</text>
  <line x1="35" y1="310" x2="135" y2="310" stroke="#1a73e8" stroke-width="3"/>
  <line x1="135" y1="310" x2="805" y2="310" stroke="#e0e0e0" stroke-width="1"/>

  <text x="780" y="296" font-size="13" fill="#5f6368" text-anchor="end">Contribute on Github  ⌥</text>

  <!-- learn more line -->
  <text x="32" y="338" font-size="13" fill="#202124">Learn more about how to use the code snippet on <tspan fill="#1a73e8" text-decoration="underline">github</tspan>.</text>

  <!-- code box -->
  <rect x="20" y="358" width="785" height="302" rx="3" fill="#e8f0fe" stroke="#d2e3fc"/>

  <!-- copy chip -->
  <text x="780" y="380" font-size="12" fill="#5f6368" text-anchor="end">Copy ⧉</text>

  <!-- code lines -->
  <g font-family="'Consolas','Roboto Mono',monospace" font-size="12.5">
    <text x="35" y="400"><tspan fill="#202124">&lt;div&gt;Teachable Machine Image Model&lt;/div&gt;</tspan></text>
    <text x="35" y="418"><tspan fill="#202124">&lt;button type=</tspan><tspan fill="#d93025">"button"</tspan><tspan fill="#202124"> onclick=</tspan><tspan fill="#d93025">"init()"</tspan><tspan fill="#202124">&gt;Start&lt;/button&gt;</tspan></text>
    <text x="35" y="436"><tspan fill="#202124">&lt;div id=</tspan><tspan fill="#d93025">"webcam-container"</tspan><tspan fill="#202124">&gt;&lt;/div&gt;</tspan></text>
    <text x="35" y="454"><tspan fill="#202124">&lt;div id=</tspan><tspan fill="#d93025">"label-container"</tspan><tspan fill="#202124">&gt;&lt;/div&gt;</tspan></text>
    <text x="35" y="472"><tspan fill="#202124">&lt;script src=</tspan><tspan fill="#d93025">"https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"</tspan><tspan fill="#202124">&gt;&lt;/script&gt;</tspan></text>
    <text x="35" y="490"><tspan fill="#202124">&lt;script src=</tspan><tspan fill="#d93025">"https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-</tspan></text>
    <text x="35" y="508"><tspan fill="#d93025">image.min.js"</tspan><tspan fill="#202124">&gt;&lt;/script&gt;</tspan></text>
    <text x="35" y="526"><tspan fill="#202124">&lt;script type=</tspan><tspan fill="#d93025">"text/javascript"</tspan><tspan fill="#202124">&gt;</tspan></text>

    <text x="55" y="550" fill="#5f6368" font-style="italic">// More API functions here:</text>
    <text x="55" y="568" fill="#5f6368" font-style="italic">// https://github.com/googlecreativelab/teachablemachine-community/tree/master/libraries/image</text>

    <text x="55" y="596" fill="#5f6368" font-style="italic">// the link to your model provided by Teachable Machine export panel</text>
    <text x="55" y="614"><tspan fill="#9c27b0">const</tspan><tspan fill="#202124"> URL = </tspan><tspan fill="#d93025">"./my_model/"</tspan><tspan fill="#202124">;</tspan></text>

    <text x="55" y="640"><tspan fill="#9c27b0">let</tspan><tspan fill="#202124"> model, webcam, labelContainer, maxPredictions;</tspan></text>

    <text x="55" y="660" fill="#5f6368" font-style="italic">// Load the image model and setup the webcam</text>
  </g>
</svg>
